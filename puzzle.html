<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASS PUZZLE</title>
  <script type="module" src="./js/index.js"></script>
</head>
<body>
  <div class="puzzle">
    <header class="header">
      <div class="header__boxes">
        <div class="header__box header__box--purple"></div>
        <div class="header__box header__box--orange"></div>
        <div class="header__box header__box--blue"></div>
      </div>
    </header>

    <div class="content">
      <aside class="sidebar"></aside>

      <main class="main">
        <div class="main__boxes">
          <div class="main__box main__box--purple"></div>
          <div class="main__box main__box--orange"></div>
          <div class="main__box main__box--blue"></div>
        </div>
      </main>
    </div>

    <footer class="footer"></footer>
  </div>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
